version: "2"
sql:
  - engine: postgresql
    schema: db/postgres/migrations
    queries: db/postgres/queries
    gen:
      go:
        package: pgdb
        out: db/postgres
        sql_package: database/sql
        emit_interface: true
        overrides:
          - db_type: jsonb
            go_type: github.com/alternayte/speccy/db/dbtype.JSON
  # SQLite declares UUIDTEXT and JSONTEXT columns (TEXT affinity) so that its generated types
  # match the Postgres ones field for field. db/sqlite/adapter.gen.go relies on that.
  - engine: sqlite
    schema: db/sqlite/migrations
    queries: db/sqlite/queries
    gen:
      go:
        package: sqlitedb
        out: db/sqlite
        overrides:
          - db_type: UUIDTEXT
            go_type: github.com/google/uuid.UUID
          - db_type: UUIDTEXT
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: NullUUID
          - db_type: JSONTEXT
            go_type: github.com/alternayte/speccy/db/dbtype.JSON

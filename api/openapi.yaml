openapi: 3.1.0
info:
  title: Speccy API
  version: 0.1.0
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
servers:
  - url: /api/v1
paths:
  /meta:
    get:
      operationId: getMeta
      summary: Get the server version and mode.
      responses:
        "200":
          description: The server version and mode.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meta"
        default:
          $ref: "#/components/responses/Problem"

  /bundles:
    get:
      operationId: listBundles
      summary: List bundles, and the folders that look like bundles but are not valid.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page of bundles.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BundleList"
        default:
          $ref: "#/components/responses/Problem"

    post:
      operationId: createBundle
      summary: Create a bundle from a profile's template (REQ-016).
      description: In local mode, Speccy writes the bundle to a new folder under the folder that Speccy serves.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBundleRequest"
      responses:
        "201":
          description: The new bundle.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bundle"
        default:
          $ref: "#/components/responses/Problem"

  /bundles/import:
    post:
      operationId: importBundle
      summary: Import a bundle from a .md file, a .zip file, or pasted markdown.
      description: >
        Send exactly one of `file` or `text`. In local mode, Speccy writes the bundle to a new
        folder named `name` under the folder that Speccy serves (REQ-008).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ImportRequest"
      responses:
        "201":
          description: The new bundle.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bundle"
        default:
          $ref: "#/components/responses/Problem"

  /bundles/{bundleId}:
    parameters:
      - $ref: "#/components/parameters/BundleId"
    get:
      operationId: getBundle
      summary: Get one bundle.
      responses:
        "200":
          description: The bundle.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bundle"
        default:
          $ref: "#/components/responses/Problem"

  /bundles/{bundleId}/files:
    parameters:
      - $ref: "#/components/parameters/BundleId"
    get:
      operationId: listFiles
      summary: List the files of a bundle version. The default is the current version.
      parameters:
        - $ref: "#/components/parameters/VersionQuery"
      responses:
        "200":
          description: The files, sorted by path.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileList"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteFile
      summary: Delete a file. Creates a version (REQ-005).
      parameters:
        - $ref: "#/components/parameters/PathQuery"
        - $ref: "#/components/parameters/BaseVersion"
      responses:
        "200":
          description: The version that the change created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WriteResult"
        default:
          $ref: "#/components/responses/Problem"

  /bundles/{bundleId}/files/content:
    parameters:
      - $ref: "#/components/parameters/BundleId"
      - $ref: "#/components/parameters/PathQuery"
    get:
      operationId: getFileContent
      summary: Get the bytes of one file in a bundle version. The default is the current version.
      parameters:
        - $ref: "#/components/parameters/VersionQuery"
      responses:
        "200":
          description: The file content.
          content:
            application/octet-stream:
              schema:
                type: string
                contentMediaType: application/octet-stream
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: putFileContent
      summary: Create or replace a file. Creates a version when the content changed (REQ-005).
      parameters:
        - $ref: "#/components/parameters/BaseVersion"
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              contentMediaType: application/octet-stream
      responses:
        "200":
          description: The version after the write.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WriteResult"
        default:
          $ref: "#/components/responses/Problem"

  /bundles/{bundleId}/files/rename:
    parameters:
      - $ref: "#/components/parameters/BundleId"
    post:
      operationId: renameFile
      summary: Rename or move a file inside the bundle. Creates a version (REQ-005).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameRequest"
      responses:
        "200":
          description: The version that the change created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WriteResult"
        default:
          $ref: "#/components/responses/Problem"

  /bundles/{bundleId}/versions:
    parameters:
      - $ref: "#/components/parameters/BundleId"
    get:
      operationId: listVersions
      summary: List the versions of a bundle, newest first.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page of versions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionList"
        default:
          $ref: "#/components/responses/Problem"

  /bundles/{bundleId}/diff:
    parameters:
      - $ref: "#/components/parameters/BundleId"
    get:
      operationId: diffVersions
      summary: Compare two versions of a bundle, by file and by section of the main doc (REQ-006).
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The differences.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Diff"
        default:
          $ref: "#/components/responses/Problem"

  /bundles/{bundleId}/export:
    parameters:
      - $ref: "#/components/parameters/BundleId"
    get:
      operationId: exportBundle
      summary: Download a bundle version as a .zip file. The default is the current version (REQ-008).
      parameters:
        - $ref: "#/components/parameters/VersionQuery"
      responses:
        "200":
          description: The .zip file.
          content:
            application/zip:
              schema:
                type: string
                contentMediaType: application/zip
        default:
          $ref: "#/components/responses/Problem"

  /bundles/{bundleId}/runs:
    parameters:
      - $ref: "#/components/parameters/BundleId"
    post:
      operationId: startRun
      summary: Start a full review of the current version (REQ-020). Lint runs on its own on every save.
      responses:
        "202":
          description: The queued run. Follow its progress at /runs/{runId}/events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        default:
          $ref: "#/components/responses/Problem"
    get:
      operationId: listRuns
      summary: List the review runs of a bundle, newest first.
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: The runs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunList"
        default:
          $ref: "#/components/responses/Problem"

  /bundles/{bundleId}/runs/estimate:
    parameters:
      - $ref: "#/components/parameters/BundleId"
    get:
      operationId: estimateRun
      summary: Estimate the tokens and cost of a full review before it starts (REQ-104).
      responses:
        "200":
          description: The estimate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunEstimate"
        default:
          $ref: "#/components/responses/Problem"

  /bundles/{bundleId}/assumptions:
    parameters:
      - $ref: "#/components/parameters/BundleId"
    get:
      operationId: listAssumptions
      summary: List the sentences of the current main doc that start with "Assumption:" (REQ-033).
      responses:
        "200":
          description: The assumptions.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Anchor"
        default:
          $ref: "#/components/responses/Problem"

  /runs/{runId}/events:
    parameters:
      - $ref: "#/components/parameters/RunId"
    get:
      operationId: runEvents
      summary: Follow a run's progress by stage, as server-sent events (REQ-026).
      responses:
        "200":
          description: A stream of events. Each data line is a RunEvent. The stream ends when the run ends.
          content:
            text/event-stream:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Problem"

  /runs/{runId}/claims:
    parameters:
      - $ref: "#/components/parameters/RunId"
    get:
      operationId: listClaims
      summary: List a run's factual claims and their labels (REQ-031).
      responses:
        "200":
          description: The claims, in document order.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Claim"
        default:
          $ref: "#/components/responses/Problem"

  /runs/{runId}/questions:
    parameters:
      - $ref: "#/components/parameters/RunId"
    get:
      operationId: listQuestions
      summary: List a run's build questions, reader answers, and results (REQ-040 to REQ-046).
      responses:
        "200":
          description: The questions in order. Empty for a run without a divergence test.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/BuildQuestion"
        default:
          $ref: "#/components/responses/Problem"

  /admin/mcp:
    get:
      operationId: listMCPConnections
      summary: List the MCP connections (REQ-112).
      responses:
        "200":
          description: The connections.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/MCPConnection"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createMCPConnection
      summary: Add an MCP connection.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MCPConnectionInput"
      responses:
        "201":
          description: The connection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MCPConnection"
        default:
          $ref: "#/components/responses/Problem"

  /admin/mcp/{connectionId}:
    parameters:
      - $ref: "#/components/parameters/ConnectionId"
    put:
      operationId: updateMCPConnection
      summary: Change an MCP connection. Leave the secret out to keep the stored one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MCPConnectionInput"
      responses:
        "200":
          description: The connection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MCPConnection"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteMCPConnection
      summary: Delete an MCP connection.
      responses:
        "204":
          description: Deleted.
        default:
          $ref: "#/components/responses/Problem"

  /admin/mcp/{connectionId}/tools:
    parameters:
      - $ref: "#/components/parameters/ConnectionId"
    get:
      operationId: listMCPTools
      summary: Connect and list the server's tools, to choose the allowlist.
      responses:
        "200":
          description: The tools.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/MCPTool"
        default:
          $ref: "#/components/responses/Problem"

  /runs/{runId}:
    parameters:
      - $ref: "#/components/parameters/RunId"
    get:
      operationId: getRun
      summary: Get one review run and its verdict.
      responses:
        "200":
          description: The run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        default:
          $ref: "#/components/responses/Problem"

  /runs/{runId}/findings:
    parameters:
      - $ref: "#/components/parameters/RunId"
    get:
      operationId: listFindings
      summary: List the findings of a run, in document order.
      responses:
        "200":
          description: The findings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FindingList"
        default:
          $ref: "#/components/responses/Problem"

  /profiles:
    get:
      operationId: listProfiles
      summary: List the profiles, with their current versions.
      responses:
        "200":
          description: The profiles.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileList"
        default:
          $ref: "#/components/responses/Problem"

  /admin/backends:
    get:
      operationId: listBackends
      summary: List the model backends. Secrets show their last 4 characters only (SDD §14.1).
      responses:
        "200":
          description: The backends.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackendList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createBackend
      summary: Add a model backend (REQ-100).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BackendInput"
      responses:
        "201":
          description: The backend.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Backend"
        default:
          $ref: "#/components/responses/Problem"

  /admin/backends/{backendId}:
    parameters:
      - $ref: "#/components/parameters/BackendId"
    put:
      operationId: updateBackend
      summary: Change a backend. Leave the secret out to keep the stored one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BackendInput"
      responses:
        "200":
          description: The backend.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Backend"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteBackend
      summary: Delete a backend that no role uses.
      responses:
        "204":
          description: Deleted.
        default:
          $ref: "#/components/responses/Problem"

  /admin/backends/{backendId}/test:
    parameters:
      - $ref: "#/components/parameters/BackendId"
    post:
      operationId: testBackend
      summary: Send one short call to a backend and model, to check the setup.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model]
              properties:
                model:
                  type: string
      responses:
        "200":
          description: The outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackendTest"
        default:
          $ref: "#/components/responses/Problem"

  /admin/presets:
    get:
      operationId: listPresets
      summary: List the agent CLI presets and whether each CLI is installed (REQ-102).
      responses:
        "200":
          description: The presets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresetList"
        default:
          $ref: "#/components/responses/Problem"

  /admin/roles:
    get:
      operationId: listRoles
      summary: List the roles and their backend and model (REQ-101).
      responses:
        "200":
          description: The roles.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleList"
        default:
          $ref: "#/components/responses/Problem"

  /admin/roles/{role}:
    parameters:
      - name: role
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/RoleName"
    put:
      operationId: assignRole
      summary: Assign a backend and model to a role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleInput"
      responses:
        "200":
          description: The role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: unassignRole
      summary: Remove a role's assignment.
      responses:
        "204":
          description: Removed.
        default:
          $ref: "#/components/responses/Problem"

  /admin/budget:
    get:
      operationId: getBudget
      summary: Get this month's token budget and use (REQ-104).
      responses:
        "200":
          description: The budget.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Budget"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: setBudget
      summary: Set the monthly token limit. No limit means no budget.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token_limit:
                  type: integer
                  format: int64
                  minimum: 0
                  description: Leave it out for no limit.
      responses:
        "200":
          description: The budget.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Budget"
        default:
          $ref: "#/components/responses/Problem"

  /render:
    post:
      operationId: renderMarkdown
      summary: Render markdown to HTML. Each block carries its source position (DEC-017).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenderRequest"
      responses:
        "200":
          description: The HTML.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RenderResult"
        default:
          $ref: "#/components/responses/Problem"

components:
  parameters:
    ConnectionId:
      name: connectionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BackendId:
      name: backendId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BundleId:
      name: bundleId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PathQuery:
      name: path
      in: query
      required: true
      description: A file path relative to the bundle folder, with / separators.
      schema:
        type: string
    VersionQuery:
      name: version
      in: query
      required: false
      schema:
        type: string
        format: uuid
    BaseVersion:
      name: base_version
      in: query
      required: true
      description: >
        The version the change is based on. When the bundle has a newer version, the request
        fails with code version_conflict, so a change never overwrites one it did not see.
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50

  responses:
    Problem:
      description: An error.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    Meta:
      type: object
      additionalProperties: false
      required: [version, mode]
      properties:
        version:
          type: string
          description: The build version of the binary.
        mode:
          type: string
          enum: [local]
          description: The mode the server runs in.

    Problem:
      type: object
      description: RFC 9457 problem details with a stable code.
      required: [type, title, status, code]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          description: A stable machine-readable error code.

    Bundle:
      type: object
      required: [id, slug, title, profile_key, source_kind, main_doc, current_version, updated_at]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
          description: In local mode, the bundle folder relative to the served folder.
        title:
          type: string
        profile_key:
          type: string
          description: The frontmatter type of the main doc.
        source_kind:
          type: string
          enum: [local, db, github]
        main_doc:
          type: string
          description: The path of the main doc in the bundle.
        current_version:
          $ref: "#/components/schemas/Version"
        updated_at:
          type: string
          format: date-time
        verdict:
          $ref: "#/components/schemas/BundleVerdict"
        run_error:
          type: string
          description: Why the latest run on the current version failed, when it failed.

    BundleVerdict:
      type: object
      description: The verdict of the bundle's latest completed run. It is stale when that run is not on the current version.
      required: [run_id, version_number, result, score, radar, waiver_count, relaxed_count, must, should, info, kind]
      properties:
        run_id:
          type: string
          format: uuid
        version_number:
          type: integer
          format: int64
        kind:
          type: string
          enum: [lint, full]
          description: lint means only the lint stage ran.
        result:
          $ref: "#/components/schemas/VerdictResult"
        score:
          type: integer
        radar:
          type: object
          additionalProperties:
            type: integer
        waiver_count:
          type: integer
        relaxed_count:
          type: integer
          description: Checks in adoption mode (REQ-133).
        must:
          type: integer
          description: Open MUST findings.
        should:
          type: integer
        info:
          type: integer
        stale_reason:
          type: string
          enum: [upstream_changed]
          description: Set when the verdict is stale because a linked bundle has a newer version than the run read (REQ-056).

    VerdictResult:
      type: string
      enum: [build_ready, not_build_ready, stale]

    CreateBundleRequest:
      type: object
      required: [profile, name]
      properties:
        profile:
          type: string
          description: The profile key.
        name:
          type: string
          description: The bundle folder name.
        title:
          type: string

    Run:
      type: object
      required: [id, bundle_id, version_id, version_number, profile_key, profile_version, kind, status, stage, error, started_at]
      properties:
        id:
          type: string
          format: uuid
        bundle_id:
          type: string
          format: uuid
        version_id:
          type: string
          format: uuid
        version_number:
          type: integer
          format: int64
        profile_key:
          type: string
        profile_version:
          type: integer
          format: int64
        kind:
          type: string
          enum: [lint, full]
        status:
          type: string
          enum: [queued, running, complete, failed]
        stage:
          type: string
        error:
          type: string
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        tokens_in:
          type: integer
          format: int64
        tokens_out:
          type: integer
          format: int64
        cost_estimate:
          type: number
          description: USD, from the prices on the role assignments.
        cache_hits:
          type: integer
          format: int64
          description: Steps answered from the cache (REQ-021).
        notes:
          type: array
          description: Notes for the run report, such as "no search source configured" (REQ-034).
          items:
            type: string
        verdict:
          $ref: "#/components/schemas/BundleVerdict"

    RunEstimate:
      type: object
      required: [calls, cached_steps, tokens_in, tokens_out, priced]
      properties:
        calls:
          type: integer
        cached_steps:
          type: integer
        tokens_in:
          type: integer
          format: int64
        tokens_out:
          type: integer
          format: int64
        cost_usd:
          type: number
        priced:
          type: boolean
          description: False when the reviewer role has no prices, so there is no cost.

    RunEvent:
      type: object
      required: [type, stage]
      properties:
        type:
          type: string
          enum: [stage, progress, done, failed]
        stage:
          type: string
        message:
          type: string
        done:
          type: integer
        total:
          type: integer
        cache_hits:
          type: integer

    Claim:
      type: object
      required: [id, text, label, reason, sources, anchor]
      properties:
        id:
          type: string
          format: uuid
        text:
          type: string
        label:
          type: string
          enum: [verified, contradicted, unverified]
        reason:
          type: string
        sources:
          type: array
          items:
            type: string
        anchor:
          $ref: "#/components/schemas/Anchor"

    BuildQuestion:
      type: object
      required: [id, number, text, level, cites, anchor, result, answers, groups]
      properties:
        id:
          type: string
          format: uuid
        number:
          type: integer
        text:
          type: string
        level:
          type: string
          enum: [MUST, SHOULD]
        cites:
          type: array
          items:
            $ref: "#/components/schemas/Cite"
        anchor:
          $ref: "#/components/schemas/Anchor"
        result:
          type: string
          enum: [agree, diverge, gap]
        answers:
          type: array
          description: One per reader, in reader order. Readers are named by number only (DEC-013).
          items:
            $ref: "#/components/schemas/ReaderAnswer"
        groups:
          type: array
          description: The judge's groups of reader numbers with the same meaning.
          items:
            type: array
            items:
              type: integer

    Cite:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [section, trace]
        path:
          type: array
          items:
            type: string
        id:
          type: string

    ReaderAnswer:
      type: object
      required: [reader, answer, answered, quotes]
      properties:
        reader:
          type: integer
        answer:
          type: string
        answered:
          type: boolean
          description: False for NOT SPECIFIED, and for an answer with no quote found in the bundle (REQ-043).
        quotes:
          type: array
          items:
            $ref: "#/components/schemas/QuoteCheck"

    QuoteCheck:
      type: object
      required: [text, found]
      properties:
        text:
          type: string
        found:
          type: boolean

    MCPConnectionInput:
      type: object
      required: [name, transport, tool_allowlist, is_search]
      properties:
        name:
          type: string
        transport:
          type: string
          enum: [stdio, http]
        command:
          type: array
          items:
            type: string
          description: For stdio, one argument per item.
        url:
          type: string
          description: For http.
        secret:
          type: string
          description: Write-only. An http server gets it as a bearer token; a stdio server as the variable in secret_env.
        secret_env:
          type: string
        tool_allowlist:
          type: array
          items:
            type: string
        is_search:
          type: boolean
        search_tool:
          type: string
          description: The allowlisted tool that searches, when is_search is true.

    MCPConnection:
      type: object
      required: [id, name, transport, has_secret, secret_last4, tool_allowlist, is_search, search_tool]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        transport:
          type: string
        command:
          type: array
          items:
            type: string
        url:
          type: string
        secret_env:
          type: string
        has_secret:
          type: boolean
        secret_last4:
          type: string
        tool_allowlist:
          type: array
          items:
            type: string
        is_search:
          type: boolean
        search_tool:
          type: string

    MCPTool:
      type: object
      required: [name, description, read_only, destructive]
      properties:
        name:
          type: string
        description:
          type: string
        read_only:
          type: boolean
        destructive:
          type: boolean

    RunList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Run"

    Anchor:
      type: object
      description: A range of text with context (SDD §8.8).
      required: [file, heading_path, quote, prefix, suffix, start, end]
      properties:
        file:
          type: string
        heading_path:
          type: array
          items:
            type: string
        quote:
          type: string
        prefix:
          type: string
        suffix:
          type: string
        start:
          type: integer
          description: Byte offset of the quote in the file.
        end:
          type: integer

    Finding:
      type: object
      required: [id, check_slug, level, stage, relaxed, message, anchor]
      properties:
        id:
          type: string
          format: uuid
        check_slug:
          type: string
        level:
          type: string
          enum: [MUST, SHOULD, INFO]
        stage:
          type: string
        relaxed:
          type: boolean
          description: The check is in adoption mode, so it reports at INFO (REQ-133).
        message:
          type: string
        fix:
          type: string
        anchor:
          $ref: "#/components/schemas/Anchor"

    FindingList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Finding"

    Profile:
      type: object
      required: [key, name, version, origin]
      properties:
        key:
          type: string
        name:
          type: string
        version:
          type: integer
          format: int64
        origin:
          type: string
          description: built-in, or the path of the profile file.

    ProfileList:
      type: object
      required: [items, problems]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Profile"
        problems:
          type: array
          description: Profile files that did not load, with the reason.
          items:
            type: string

    BackendKind:
      type: string
      enum: [openai, anthropic, openrouter, deepseek, agent_cli]

    BackendInput:
      type: object
      required: [kind, name]
      properties:
        kind:
          $ref: "#/components/schemas/BackendKind"
        name:
          type: string
        secret:
          type: string
          description: The API key. Write-only.
        base_url:
          type: string
          description: Overrides the provider's API address.
        preset:
          type: string
          description: "For agent_cli: claude, cursor-agent, opencode, pi, or custom."
        command:
          type: array
          items:
            type: string
          description: For a custom agent CLI. {model}, {schema}, and {prompt_file} are replaced.
        prompt_via:
          type: string
          enum: [stdin, file]

    Backend:
      type: object
      required: [id, kind, name, has_secret, secret_last4, roles]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/BackendKind"
        name:
          type: string
        has_secret:
          type: boolean
        secret_last4:
          type: string
        base_url:
          type: string
        preset:
          type: string
        command:
          type: array
          items:
            type: string
        prompt_via:
          type: string
        roles:
          type: array
          description: The roles that use this backend.
          items:
            type: string

    BackendList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Backend"

    BackendTest:
      type: object
      required: [ok, duration_ms]
      properties:
        ok:
          type: boolean
        answer:
          type: string
        error:
          type: string
        tokens_in:
          type: integer
          format: int64
        tokens_out:
          type: integer
          format: int64
        estimated:
          type: boolean
        duration_ms:
          type: integer
          format: int64

    Preset:
      type: object
      required: [name, installed, command, verified]
      properties:
        name:
          type: string
        installed:
          type: boolean
        command:
          type: array
          items:
            type: string
        verified:
          type: string

    PresetList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Preset"

    RoleName:
      type: string
      enum: [reviewer, reader_1, reader_2, reader_3, judge, writer]

    RoleInput:
      type: object
      required: [backend_id, model]
      properties:
        backend_id:
          type: string
          format: uuid
        model:
          type: string
        price_in_per_mtok:
          type: number
          description: Price per million input tokens, for cost estimates.
        price_out_per_mtok:
          type: number

    Role:
      type: object
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/RoleName"
        backend_id:
          type: string
          format: uuid
        model:
          type: string
        price_in_per_mtok:
          type: number
        price_out_per_mtok:
          type: number

    RoleList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Role"

    Budget:
      type: object
      required: [month, tokens_used]
      properties:
        month:
          type: string
          description: YYYY-MM, in UTC.
        token_limit:
          type: integer
          format: int64
        tokens_used:
          type: integer
          format: int64

    BundleList:
      type: object
      required: [items, problems]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Bundle"
        next_cursor:
          type: string
        problems:
          type: array
          description: Folders that are not valid bundles, for example with two main docs (REQ-001).
          items:
            $ref: "#/components/schemas/BundleProblem"

    BundleProblem:
      type: object
      required: [path, message]
      properties:
        path:
          type: string
        message:
          type: string

    BundleFile:
      type: object
      required: [path, size, sha256, is_main_doc]
      properties:
        path:
          type: string
        size:
          type: integer
          format: int64
        sha256:
          type: string
        is_main_doc:
          type: boolean

    FileList:
      type: object
      required: [version, items]
      properties:
        version:
          $ref: "#/components/schemas/Version"
        items:
          type: array
          items:
            $ref: "#/components/schemas/BundleFile"

    Version:
      type: object
      required: [id, number, created_by, message, created_at]
      properties:
        id:
          type: string
          format: uuid
        number:
          type: integer
          format: int64
        created_by:
          type: string
        message:
          type: string
        created_at:
          type: string
          format: date-time

    VersionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Version"
        next_cursor:
          type: string

    WriteResult:
      type: object
      required: [version, changed]
      properties:
        version:
          $ref: "#/components/schemas/Version"
        changed:
          type: boolean
          description: False when the write left the bundle unchanged, so no version was created.

    RenameRequest:
      type: object
      required: [from, to, base_version]
      properties:
        from:
          type: string
        to:
          type: string
        base_version:
          type: string
          format: uuid

    ImportRequest:
      type: object
      properties:
        name:
          type: string
          description: The bundle folder name. The default comes from the file name or the doc title.
        file:
          type: string
          contentMediaType: application/octet-stream
          description: A .md file or a .zip file.
        text:
          type: string
          description: Pasted markdown.

    Diff:
      type: object
      required: [from, to, files, sections]
      properties:
        from:
          $ref: "#/components/schemas/Version"
        to:
          $ref: "#/components/schemas/Version"
        files:
          type: array
          items:
            $ref: "#/components/schemas/FileDiff"
        sections:
          type: array
          description: The sections of the main doc, matched by heading path.
          items:
            $ref: "#/components/schemas/SectionDiff"

    ChangeStatus:
      type: string
      enum: [added, removed, modified, unchanged]

    FileDiff:
      type: object
      required: [path, status, binary, lines]
      properties:
        path:
          type: string
        status:
          $ref: "#/components/schemas/ChangeStatus"
        binary:
          type: boolean
        lines:
          type: array
          description: Line operations for a modified text file. Empty otherwise.
          items:
            $ref: "#/components/schemas/LineOp"

    SectionDiff:
      type: object
      required: [heading_path, status, lines]
      properties:
        heading_path:
          type: array
          items:
            type: string
        status:
          $ref: "#/components/schemas/ChangeStatus"
        lines:
          type: array
          items:
            $ref: "#/components/schemas/LineOp"

    LineOp:
      type: object
      required: [op, text]
      properties:
        op:
          type: string
          enum: [equal, insert, delete]
        text:
          type: string
          description: One or more whole lines, each ending with a newline except possibly the last line of the file.

    RenderRequest:
      type: object
      required: [markdown]
      properties:
        markdown:
          type: string
        bundle_id:
          type: string
          format: uuid
          description: When set, relative image links resolve to files in this bundle.
        path:
          type: string
          description: The path of the file in the bundle, so relative links resolve from its folder.

    RenderResult:
      type: object
      required: [html]
      properties:
        html:
          type: string
          description: >
            HTML. Each block element has data-src-start and data-src-end (byte offsets into the
            markdown) and data-line (the 1-based first line). Mermaid blocks are
            <pre class="mermaid">.

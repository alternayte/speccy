openapi: 3.1.0
info:
  title: Speccy API
  version: 0.1.0
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
servers:
  - url: /api/v1
paths:
  /meta:
    get:
      operationId: getMeta
      summary: Get the server version and mode.
      responses:
        "200":
          description: The server version and mode.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meta"
        default:
          $ref: "#/components/responses/Problem"

  /me:
    get:
      operationId: getMe
      summary: Who the caller is (SDD §3). Anonymous callers get signed_in false.
      responses:
        "200":
          description: The caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Problem"

  /share/{token}:
    parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getShare
      summary: Look up a share link (REQ-085). A revoked or expired link is not found.
      responses:
        "200":
          description: The shared bundle.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareInfo"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: joinShare
      summary: Enter a share link as a guest with a display name (REQ-086). Sets the guest cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [display_name]
              properties:
                display_name:
                  type: string
                  minLength: 1
                  maxLength: 60
      responses:
        "200":
          description: The guest may now read the bundle.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareInfo"
        default:
          $ref: "#/components/responses/Problem"

  /bundles/{bundleId}/access:
    parameters:
      - $ref: "#/components/parameters/BundleId"
    get:
      operationId: getBundleAccess
      summary: Who can see the bundle, and its share link state (REQ-084, REQ-085).
      responses:
        "200":
          description: The access of the bundle.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BundleAccess"
        default:
          $ref: "#/components/responses/Problem"

  /bundles/{bundleId}/visibility:
    parameters:
      - $ref: "#/components/parameters/BundleId"
    put:
      operationId: setVisibility
      summary: Set the visibility of the bundle (REQ-084). Leaving link visibility revokes the share link.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [visibility]
              properties:
                visibility:
                  $ref: "#/components/schemas/Visibility"
      responses:
        "200":
          description: The access of the bundle.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BundleAccess"
        default:
          $ref: "#/components/responses/Problem"

  /bundles/{bundleId}/share:
    parameters:
      - $ref: "#/components/parameters/BundleId"
    post:
      operationId: createShareLink
      summary: Make a new share link (REQ-085). It replaces the old one and sets link visibility. The URL appears one time.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                expires_at:
                  type: string
                  format: date-time
      responses:
        "200":
          description: The new link.
          content:
            application/json:
              schema:
                type: object
                required: [url, access]
                properties:
                  url:
                    type: string
                  access:
                    $ref: "#/components/schemas/BundleAccess"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: revokeShareLink
      summary: Revoke the share link (REQ-085).
      responses:
        "200":
          description: The access of the bundle.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BundleAccess"
        default:
          $ref: "#/components/responses/Problem"

  /admin/invites:
    get:
      operationId: listInvites
      summary: List invite links, newest first (REQ-081).
      responses:
        "200":
          description: The invites. A list never carries a token.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Invite"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createInvite
      summary: Make a single-use invite link with a role (REQ-081). The URL appears one time.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  type: string
                  enum: [admin, member]
      responses:
        "200":
          description: The invite and its link.
          content:
            application/json:
              schema:
                type: object
                required: [url, invite]
                properties:
                  url:
                    type: string
                  invite:
                    $ref: "#/components/schemas/Invite"
        default:
          $ref: "#/components/responses/Problem"

  /admin/invites/{inviteId}/revoke:
    parameters:
      - name: inviteId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: revokeInvite
      summary: Revoke an unused invite link.
      responses:
        "204":
          description: Revoked.
        default:
          $ref: "#/components/responses/Problem"

  /admin/reset-links:
    post:
      operationId: createResetLink
      summary: Make a one-time password reset link for a user (REQ-082). The URL appears one time.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
      responses:
        "200":
          description: The link.
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url:
                    type: string
        default:
          $ref: "#/components/responses/Problem"

  /admin/settings:
    get:
      operationId: getSettings
      summary: The workspace settings (REQ-009, REQ-081, REQ-105).
      responses:
        "200":
          description: The settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: setSettings
      summary: Change the workspace settings.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Settings"
      responses:
        "200":
          description: The settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        default:
          $ref: "#/components/responses/Problem"

  /bundles:
    get:
      operationId: listBundles
      summary: List bundles, and the folders that look like bundles but are not valid.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page of bundles.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BundleList"
        default:
          $ref: "#/components/responses/Problem"

    post:
      operationId: createBundle
      summary: Create a bundle from a profile's template (REQ-016).
      description: In local mode, Speccy writes the bundle to a new folder under the folder that Speccy serves.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBundleRequest"
      responses:
        "201":
          description: The new bundle.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bundle"
        default:
          $ref: "#/components/responses/Problem"

  /bundles/import:
    post:
      operationId: importBundle
      summary: Import a bundle from a .md file, a .zip file, or pasted markdown.
      description: >
        Send exactly one of `file` or `text`. In local mode, Speccy writes the bundle to a new
        folder named `name` under the folder that Speccy serves (REQ-008).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ImportRequest"
      responses:
        "201":
          description: The new bundle.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bundle"
        default:
          $ref: "#/components/responses/Problem"

  /bundles/{bundleId}:
    parameters:
      - $ref: "#/components/parameters/BundleId"
    get:
      operationId: getBundle
      summary: Get one bundle.
      responses:
        "200":
          description: The bundle.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bundle"
        default:
          $ref: "#/components/responses/Problem"

  /bundles/{bundleId}/files:
    parameters:
      - $ref: "#/components/parameters/BundleId"
    get:
      operationId: listFiles
      summary: List the files of a bundle version. The default is the current version.
      parameters:
        - $ref: "#/components/parameters/VersionQuery"
      responses:
        "200":
          description: The files, sorted by path.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileList"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteFile
      summary: Delete a file. Creates a version (REQ-005).
      parameters:
        - $ref: "#/components/parameters/PathQuery"
        - $ref: "#/components/parameters/BaseVersion"
      responses:
        "200":
          description: The version that the change created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WriteResult"
        default:
          $ref: "#/components/responses/Problem"

  /bundles/{bundleId}/files/content:
    parameters:
      - $ref: "#/components/parameters/BundleId"
      - $ref: "#/components/parameters/PathQuery"
    get:
      operationId: getFileContent
      summary: Get the bytes of one file in a bundle version. The default is the current version.
      parameters:
        - $ref: "#/components/parameters/VersionQuery"
      responses:
        "200":
          description: The file content.
          content:
            application/octet-stream:
              schema:
                type: string
                contentMediaType: application/octet-stream
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: putFileContent
      summary: Create or replace a file. Creates a version when the content changed (REQ-005).
      parameters:
        - $ref: "#/components/parameters/BaseVersion"
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              contentMediaType: application/octet-stream
      responses:
        "200":
          description: The version after the write.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WriteResult"
        default:
          $ref: "#/components/responses/Problem"

  /bundles/{bundleId}/files/rename:
    parameters:
      - $ref: "#/components/parameters/BundleId"
    post:
      operationId: renameFile
      summary: Rename or move a file inside the bundle. Creates a version (REQ-005).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameRequest"
      responses:
        "200":
          description: The version that the change created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WriteResult"
        default:
          $ref: "#/components/responses/Problem"

  /bundles/{bundleId}/versions:
    parameters:
      - $ref: "#/components/parameters/BundleId"
    get:
      operationId: listVersions
      summary: List the versions of a bundle, newest first.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page of versions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionList"
        default:
          $ref: "#/components/responses/Problem"

  /bundles/{bundleId}/diff:
    parameters:
      - $ref: "#/components/parameters/BundleId"
    get:
      operationId: diffVersions
      summary: Compare two versions of a bundle, by file and by section of the main doc (REQ-006).
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The differences.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Diff"
        default:
          $ref: "#/components/responses/Problem"

  /bundles/{bundleId}/export:
    parameters:
      - $ref: "#/components/parameters/BundleId"
    get:
      operationId: exportBundle
      summary: Download a bundle version as a .zip file, or the current version as a self-contained HTML report with the verdict (REQ-008).
      parameters:
        - $ref: "#/components/parameters/VersionQuery"
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [zip, html]
            default: zip
      responses:
        "200":
          description: The .zip file, or the HTML report.
          content:
            application/zip:
              schema:
                type: string
                contentMediaType: application/zip
            text/html:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Problem"

  /bundles/{bundleId}/runs:
    parameters:
      - $ref: "#/components/parameters/BundleId"
    post:
      operationId: startRun
      summary: Start a full review of the current version (REQ-020). Lint runs on its own on every save.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartRunRequest"
      responses:
        "202":
          description: The queued run. Follow its progress at /runs/{runId}/events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        default:
          $ref: "#/components/responses/Problem"
    get:
      operationId: listRuns
      summary: List the review runs of a bundle, newest first.
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: The runs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunList"
        default:
          $ref: "#/components/responses/Problem"

  /reviews:
    post:
      operationId: reviewContent
      summary: Review bundle files that are not saved on the server (SDD §12.2 --server, REQ-111 review_content). The server keeps the files and the result for 90 days for the report (SDD §12.4); it changes no bundle.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContentReviewRequest"
      responses:
        "200":
          description: The findings and the verdict.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentReview"
        default:
          $ref: "#/components/responses/Problem"

  /reviews/{reviewId}/report:
    parameters:
      - name: reviewId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getContentReviewReport
      summary: The self-contained HTML report of a review from POST /reviews (SDD §12.4).
      responses:
        "200":
          description: The HTML report.
          content:
            text/html:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Problem"

  /bundles/{bundleId}/runs/estimate:
    parameters:
      - $ref: "#/components/parameters/BundleId"
    get:
      operationId: estimateRun
      summary: Estimate the tokens and cost of a full review before it starts (REQ-104).
      responses:
        "200":
          description: The estimate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunEstimate"
        default:
          $ref: "#/components/responses/Problem"

  /bundles/{bundleId}/assumptions:
    parameters:
      - $ref: "#/components/parameters/BundleId"
    get:
      operationId: listAssumptions
      summary: List the sentences of the current main doc that start with "Assumption:" (REQ-033).
      responses:
        "200":
          description: The assumptions.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Anchor"
        default:
          $ref: "#/components/responses/Problem"

  /bundles/{bundleId}/trace:
    parameters:
      - $ref: "#/components/parameters/BundleId"
    get:
      operationId: getTrace
      summary: The bundle's links, its traceability matrices, and suggested trace IDs (REQ-050, REQ-052, REQ-058).
      responses:
        "200":
          description: The trace view of the current version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraceView"
        default:
          $ref: "#/components/responses/Problem"

  /bundles/{bundleId}/trace/ids:
    parameters:
      - $ref: "#/components/parameters/BundleId"
      - $ref: "#/components/parameters/BaseVersion"
    post:
      operationId: addTraceIds
      summary: Insert suggested trace IDs into the main doc (REQ-052). Speccy changes the doc only on this request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  minItems: 1
                  items:
                    type: string
                  description: The suggested IDs to insert, from GET /trace.
      responses:
        "200":
          description: The new version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WriteResult"
        default:
          $ref: "#/components/responses/Problem"

  /runs/{runId}/events:
    parameters:
      - $ref: "#/components/parameters/RunId"
    get:
      operationId: runEvents
      summary: Follow a run's progress by stage, as server-sent events (REQ-026).
      responses:
        "200":
          description: A stream of events. Each data line is a RunEvent. The stream ends when the run ends.
          content:
            text/event-stream:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Problem"

  /runs/{runId}/claims:
    parameters:
      - $ref: "#/components/parameters/RunId"
    get:
      operationId: listClaims
      summary: List a run's factual claims and their labels (REQ-031).
      responses:
        "200":
          description: The claims, in document order.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Claim"
        default:
          $ref: "#/components/responses/Problem"

  /runs/{runId}/questions:
    parameters:
      - $ref: "#/components/parameters/RunId"
    get:
      operationId: listQuestions
      summary: List a run's build questions, reader answers, and results (REQ-040 to REQ-046).
      responses:
        "200":
          description: The questions in order. Empty for a run without a divergence test.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/BuildQuestion"
        default:
          $ref: "#/components/responses/Problem"

  /admin/mcp:
    get:
      operationId: listMCPConnections
      summary: List the MCP connections (REQ-112).
      responses:
        "200":
          description: The connections.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/MCPConnection"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createMCPConnection
      summary: Add an MCP connection.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MCPConnectionInput"
      responses:
        "201":
          description: The connection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MCPConnection"
        default:
          $ref: "#/components/responses/Problem"

  /admin/mcp/{connectionId}:
    parameters:
      - $ref: "#/components/parameters/ConnectionId"
    put:
      operationId: updateMCPConnection
      summary: Change an MCP connection. Leave the secret out to keep the stored one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MCPConnectionInput"
      responses:
        "200":
          description: The connection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MCPConnection"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteMCPConnection
      summary: Delete an MCP connection.
      responses:
        "204":
          description: Deleted.
        default:
          $ref: "#/components/responses/Problem"

  /admin/mcp/{connectionId}/tools:
    parameters:
      - $ref: "#/components/parameters/ConnectionId"
    get:
      operationId: listMCPTools
      summary: Connect and list the server's tools, to choose the allowlist.
      responses:
        "200":
          description: The tools.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/MCPTool"
        default:
          $ref: "#/components/responses/Problem"

  /runs/{runId}:
    parameters:
      - $ref: "#/components/parameters/RunId"
    get:
      operationId: getRun
      summary: Get one review run and its verdict.
      responses:
        "200":
          description: The run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        default:
          $ref: "#/components/responses/Problem"

  /bundles/{bundleId}/tour:
    parameters:
      - $ref: "#/components/parameters/BundleId"
    get:
      operationId: getTour
      summary: The ordered points of the bundle's current review that need a human decision (SDD §13.3).
      responses:
        "200":
          description: The tour.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tour"
        default:
          $ref: "#/components/responses/Problem"

  /bundles/{bundleId}/diff/summary:
    parameters:
      - $ref: "#/components/parameters/BundleId"
    post:
      operationId: summarizeDiff
      summary: Summarize what changed in meaning between two versions, and the change in findings (REQ-007).
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiffSummary"
        default:
          $ref: "#/components/responses/Problem"

  /runs/{runId}/report:
    parameters:
      - $ref: "#/components/parameters/RunId"
    get:
      operationId: getRunReport
      summary: "The run report (SDD §13.1): stage timings, reader diversity, and findings by category."
      responses:
        "200":
          description: The report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunReport"
        default:
          $ref: "#/components/responses/Problem"

  /runs/{runId}/findings/{findingId}/fix:
    parameters:
      - $ref: "#/components/parameters/RunId"
      - $ref: "#/components/parameters/FindingId"
    post:
      operationId: suggestFix
      summary: Ask the AI for a patch that fixes one finding (REQ-025). The doc does not change.
      responses:
        "200":
          description: The suggested patch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FixSuggestion"
        default:
          $ref: "#/components/responses/Problem"

  /runs/{runId}/findings/{findingId}/fix/accept:
    parameters:
      - $ref: "#/components/parameters/RunId"
      - $ref: "#/components/parameters/FindingId"
    post:
      operationId: acceptFix
      summary: Apply the finding's suggested patch to the current version as a new version (REQ-025). Speccy changes the doc only on this request.
      responses:
        "200":
          description: The new version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WriteResult"
        default:
          $ref: "#/components/responses/Problem"

  /runs/{runId}/findings:
    parameters:
      - $ref: "#/components/parameters/RunId"
    get:
      operationId: listFindings
      summary: List the findings of a run, in document order.
      responses:
        "200":
          description: The findings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FindingList"
        default:
          $ref: "#/components/responses/Problem"

  /bundles/{bundleId}/threads:
    parameters:
      - $ref: "#/components/parameters/BundleId"
    get:
      operationId: listBundleThreads
      summary: List the threads of a bundle, open first (REQ-087).
      responses:
        "200":
          description: The threads.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Thread"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: openBundleThread
      summary: Open a thread on a bundle, anchored to text, a section, or a finding (REQ-087). A guest opens threads for humans only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenThread"
      responses:
        "200":
          description: The new thread.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThreadDetail"
        default:
          $ref: "#/components/responses/Problem"

  /threads/{threadId}:
    parameters:
      - $ref: "#/components/parameters/ThreadId"
    get:
      operationId: getThread
      summary: A thread with its messages.
      responses:
        "200":
          description: The thread.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThreadDetail"
        default:
          $ref: "#/components/responses/Problem"

  /threads/{threadId}/messages:
    parameters:
      - $ref: "#/components/parameters/ThreadId"
    post:
      operationId: postMessage
      summary: Post a message. In a thread for the AI, the AI answers with sources (REQ-088).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostMessage"
      responses:
        "200":
          description: The thread.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThreadDetail"
        default:
          $ref: "#/components/responses/Problem"

  /threads/{threadId}/decision:
    parameters:
      - $ref: "#/components/parameters/ThreadId"
    post:
      operationId: markDecision
      summary: Mark a message as the thread's decision. A later decision is recorded as a reversal (REQ-089).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message_id]
              properties:
                message_id:
                  type: string
                  format: uuid
      responses:
        "200":
          description: The thread.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThreadDetail"
        default:
          $ref: "#/components/responses/Problem"

  /threads/{threadId}/blocking:
    parameters:
      - $ref: "#/components/parameters/ThreadId"
    put:
      operationId: setThreadBlocking
      summary: Mark the thread blocking or not. An open blocking thread prevents Build Ready (REQ-089).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [blocking]
              properties:
                blocking:
                  type: boolean
      responses:
        "200":
          description: The thread.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThreadDetail"
        default:
          $ref: "#/components/responses/Problem"

  /threads/{threadId}/status:
    parameters:
      - $ref: "#/components/parameters/ThreadId"
    put:
      operationId: setThreadStatus
      summary: Resolve or reopen the thread.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [open]
              properties:
                open:
                  type: boolean
      responses:
        "200":
          description: The thread.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThreadDetail"
        default:
          $ref: "#/components/responses/Problem"

  /bundles/{bundleId}/waivers:
    parameters:
      - $ref: "#/components/parameters/BundleId"
    get:
      operationId: listWaivers
      summary: List the waivers of a bundle (REQ-072 to REQ-074).
      responses:
        "200":
          description: The waivers, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Waiver"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: requestWaiver
      summary: Request a waiver for one finding, with a reason of at least 20 characters (REQ-072).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [finding_id, reason]
              properties:
                finding_id:
                  type: string
                  format: uuid
                reason:
                  type: string
      responses:
        "200":
          description: The waiver.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Waiver"
        default:
          $ref: "#/components/responses/Problem"

  /waivers/{waiverId}/approve:
    parameters:
      - $ref: "#/components/parameters/WaiverId"
    post:
      operationId: approveWaiver
      summary: Approve a waiver under the profile's policy (REQ-073, §9.1). A final approval writes it to the frontmatter (DEC-009).
      responses:
        "200":
          description: The waiver.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Waiver"
        default:
          $ref: "#/components/responses/Problem"

  /waivers/{waiverId}/reject:
    parameters:
      - $ref: "#/components/parameters/WaiverId"
    post:
      operationId: rejectWaiver
      summary: Reject a waiver.
      responses:
        "200":
          description: The waiver.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Waiver"
        default:
          $ref: "#/components/responses/Problem"

  /bundles/{bundleId}/status:
    parameters:
      - $ref: "#/components/parameters/BundleId"
    get:
      operationId: getBundleStatus
      summary: The review status of a bundle (§9.5).
      responses:
        "200":
          description: The status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BundleStatus"
        default:
          $ref: "#/components/responses/Problem"

  /bundles/{bundleId}/review-request:
    parameters:
      - $ref: "#/components/parameters/BundleId"
    post:
      operationId: requestReview
      summary: Ask for a review and assign reviewers (REQ-090). A draft moves to in review.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reviewers]
              properties:
                reviewers:
                  type: array
                  items:
                    type: string
                  description: User IDs.
      responses:
        "200":
          description: The status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BundleStatus"
        default:
          $ref: "#/components/responses/Problem"

  /bundles/{bundleId}/approve:
    parameters:
      - $ref: "#/components/parameters/BundleId"
    post:
      operationId: approveBundle
      summary: Approve the current version (REQ-076). The author cannot approve. Approval needs a current Build Ready verdict.
      responses:
        "200":
          description: The status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BundleStatus"
        default:
          $ref: "#/components/responses/Problem"

  /people:
    get:
      operationId: listPeople
      summary: The members of the workspace, for reviewers and mentions. Empty in local mode.
      responses:
        "200":
          description: The people.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Person"
        default:
          $ref: "#/components/responses/Problem"

  /inbox:
    get:
      operationId: getInbox
      summary: The caller's inbox (REQ-091).
      responses:
        "200":
          description: The inbox.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Inbox"
        default:
          $ref: "#/components/responses/Problem"

  /inbox/seen:
    post:
      operationId: markInboxSeen
      summary: Mark the inbox as read up to now.
      responses:
        "204":
          description: Marked.
        default:
          $ref: "#/components/responses/Problem"

  /insights:
    get:
      operationId: getInsights
      summary: The metrics of SDD §8.9, per profile (REQ-092). Maintainers and admins.
      responses:
        "200":
          description: The metrics.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Insights"
        default:
          $ref: "#/components/responses/Problem"

  /profiles/{key}:
    parameters:
      - $ref: "#/components/parameters/ProfileKey"
    get:
      operationId: getProfile
      summary: A profile with its YAML, template, versions, and maintainers (REQ-013).
      responses:
        "200":
          description: The profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileDetail"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: updateProfile
      summary: Save a profile as a new version (REQ-012, REQ-013). Maintainers of the profile and admins.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileInput"
      responses:
        "200":
          description: The profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileDetail"
        default:
          $ref: "#/components/responses/Problem"

  /profiles/{key}/maintainers:
    parameters:
      - $ref: "#/components/parameters/ProfileKey"
    put:
      operationId: setMaintainers
      summary: Set the maintainers of a profile. Admins only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_ids]
              properties:
                user_ids:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: The profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileDetail"
        default:
          $ref: "#/components/responses/Problem"

  /profiles/{key}/threads:
    parameters:
      - $ref: "#/components/parameters/ProfileKey"
    get:
      operationId: listProfileThreads
      summary: The suggestions for a profile, as threads on its checks (REQ-015).
      responses:
        "200":
          description: The threads.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Thread"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: openProfileThread
      summary: Suggest a change to a check, the template, or a limit (REQ-015).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenThread"
      responses:
        "200":
          description: The new thread.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThreadDetail"
        default:
          $ref: "#/components/responses/Problem"

  /profiles:
    post:
      operationId: createProfile
      summary: Create a profile for a new doc type. Admins only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/ProfileInput"
                - type: object
                  required: [key]
                  properties:
                    key:
                      type: string
                      pattern: "^[a-z][a-z0-9-]{1,30}$"
      responses:
        "200":
          description: The profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileDetail"
        default:
          $ref: "#/components/responses/Problem"
    get:
      operationId: listProfiles
      summary: List the profiles, with their current versions.
      responses:
        "200":
          description: The profiles.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileList"
        default:
          $ref: "#/components/responses/Problem"

  /admin/backends:
    get:
      operationId: listBackends
      summary: List the model backends. Secrets show their last 4 characters only (SDD §14.1).
      responses:
        "200":
          description: The backends.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackendList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createBackend
      summary: Add a model backend (REQ-100).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BackendInput"
      responses:
        "201":
          description: The backend.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Backend"
        default:
          $ref: "#/components/responses/Problem"

  /admin/backends/{backendId}:
    parameters:
      - $ref: "#/components/parameters/BackendId"
    put:
      operationId: updateBackend
      summary: Change a backend. Leave the secret out to keep the stored one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BackendInput"
      responses:
        "200":
          description: The backend.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Backend"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteBackend
      summary: Delete a backend that no role uses.
      responses:
        "204":
          description: Deleted.
        default:
          $ref: "#/components/responses/Problem"

  /admin/backends/{backendId}/test:
    parameters:
      - $ref: "#/components/parameters/BackendId"
    post:
      operationId: testBackend
      summary: Send one short call to a backend and model, to check the setup.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model]
              properties:
                model:
                  type: string
      responses:
        "200":
          description: The outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackendTest"
        default:
          $ref: "#/components/responses/Problem"

  /admin/presets:
    get:
      operationId: listPresets
      summary: List the agent CLI presets and whether each CLI is installed (REQ-102).
      responses:
        "200":
          description: The presets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresetList"
        default:
          $ref: "#/components/responses/Problem"

  /admin/roles:
    get:
      operationId: listRoles
      summary: List the roles and their backend and model (REQ-101).
      responses:
        "200":
          description: The roles.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleList"
        default:
          $ref: "#/components/responses/Problem"

  /admin/roles/{role}:
    parameters:
      - name: role
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/RoleName"
    put:
      operationId: assignRole
      summary: Assign a backend and model to a role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleInput"
      responses:
        "200":
          description: The role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: unassignRole
      summary: Remove a role's assignment.
      responses:
        "204":
          description: Removed.
        default:
          $ref: "#/components/responses/Problem"

  /admin/github:
    get:
      operationId: getGithubConnection
      summary: The GitHub token of the workspace (DEC-019). The token itself is never returned.
      responses:
        "200":
          description: The connection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GithubConnection"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: setGithubConnection
      summary: Set the fine-grained personal access token that reads repos and opens pull requests.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  minLength: 1
                api_url:
                  type: string
                  description: The GitHub API. The default is https://api.github.com. GitHub Enterprise Server uses https://<host>/api/v3.
      responses:
        "200":
          description: The connection, after a check with GitHub.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GithubConnection"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteGithubConnection
      summary: Remove the GitHub token. The GitHub sources stop syncing.
      responses:
        "204":
          description: Removed.
        default:
          $ref: "#/components/responses/Problem"

  /github/sources:
    get:
      operationId: listGithubSources
      summary: The GitHub repos, branches, and folders that Speccy reads bundles from (REQ-123).
      responses:
        "200":
          description: The sources.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/GithubSource"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: addGithubSource
      summary: Read the bundles of a folder on a branch of a repo, and keep them in step (REQ-123).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [repo]
              properties:
                repo:
                  type: string
                  description: owner/name
                branch:
                  type: string
                  description: The default is the repo's default branch.
                path:
                  type: string
                  description: The folder in the repo. The default is the whole repo.
      responses:
        "200":
          description: The source, after its first sync.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GithubSource"
        default:
          $ref: "#/components/responses/Problem"

  /github/sources/{sourceId}:
    parameters:
      - $ref: "#/components/parameters/SourceId"
    delete:
      operationId: deleteGithubSource
      summary: Stop reading a source. Its bundles are archived; their reviews and threads stay.
      responses:
        "204":
          description: Removed.
        default:
          $ref: "#/components/responses/Problem"

  /github/sources/{sourceId}/sync:
    parameters:
      - $ref: "#/components/parameters/SourceId"
    post:
      operationId: syncGithubSource
      summary: Read the source's branch now.
      responses:
        "200":
          description: The source after the sync.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GithubSource"
        default:
          $ref: "#/components/responses/Problem"

  /bundles/{bundleId}/publish:
    parameters:
      - $ref: "#/components/parameters/BundleId"
    post:
      operationId: publishBundle
      summary: Publish the draft of a GitHub bundle as a branch, a commit, and a pull request (REQ-123).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  description: The commit message and pull request title.
      responses:
        "200":
          description: The pull request.
          content:
            application/json:
              schema:
                type: object
                required: [pr_url, pr_number]
                properties:
                  pr_url:
                    type: string
                  pr_number:
                    type: integer
        default:
          $ref: "#/components/responses/Problem"

  /bundles/{bundleId}/draft/discard:
    parameters:
      - $ref: "#/components/parameters/BundleId"
    post:
      operationId: discardDraft
      summary: Drop the draft of a GitHub bundle. The version from GitHub becomes current again.
      responses:
        "200":
          description: The new version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WriteResult"
        default:
          $ref: "#/components/responses/Problem"

  /admin/budget:
    get:
      operationId: getBudget
      summary: Get this month's token budget and use (REQ-104).
      responses:
        "200":
          description: The budget.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Budget"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: setBudget
      summary: Set the monthly token limit. No limit means no budget.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token_limit:
                  type: integer
                  format: int64
                  minimum: 0
                  description: Leave it out for no limit.
      responses:
        "200":
          description: The budget.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Budget"
        default:
          $ref: "#/components/responses/Problem"

  /render:
    post:
      operationId: renderMarkdown
      summary: Render markdown to HTML. Each block carries its source position (DEC-017).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenderRequest"
      responses:
        "200":
          description: The HTML.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RenderResult"
        default:
          $ref: "#/components/responses/Problem"

components:
  parameters:
    ConnectionId:
      name: connectionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BackendId:
      name: backendId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FindingId:
      name: findingId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SourceId:
      name: sourceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ThreadId:
      name: threadId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WaiverId:
      name: waiverId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProfileKey:
      name: key
      in: path
      required: true
      schema:
        type: string
    BundleId:
      name: bundleId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PathQuery:
      name: path
      in: query
      required: true
      description: A file path relative to the bundle folder, with / separators.
      schema:
        type: string
    VersionQuery:
      name: version
      in: query
      required: false
      schema:
        type: string
        format: uuid
    BaseVersion:
      name: base_version
      in: query
      required: true
      description: >
        The version the change is based on. When the bundle has a newer version, the request
        fails with code version_conflict, so a change never overwrites one it did not see.
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50

  responses:
    Problem:
      description: An error.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    Meta:
      type: object
      additionalProperties: false
      required: [version, mode]
      properties:
        version:
          type: string
          description: The build version of the binary.
        mode:
          type: string
          enum: [local, hosted]
          description: The mode the server runs in.
        sign_in_providers:
          type: array
          description: The OAuth providers of hosted mode (REQ-080), by their auth-all ID. A provider signs in a person who linked it to their account.
          items:
            type: string
            enum: [oidc, github]

    Me:
      type: object
      required: [signed_in, mode]
      properties:
        signed_in:
          type: boolean
        mode:
          type: string
          enum: [local, hosted]
        user_id:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [admin, member]
        maintainer:
          type: boolean
          description: The caller maintains at least one profile.
        guest:
          type: object
          required: [name, bundle_id]
          properties:
            name:
              type: string
            bundle_id:
              type: string
              format: uuid

    Visibility:
      type: string
      enum: [private, internal, link]

    ShareInfo:
      type: object
      required: [bundle_id, title]
      properties:
        bundle_id:
          type: string
          format: uuid
        title:
          type: string

    BundleAccess:
      type: object
      required: [visibility, authors, reviewers, share_active, can_edit]
      properties:
        visibility:
          $ref: "#/components/schemas/Visibility"
        authors:
          type: array
          items:
            type: string
          description: Author user IDs.
        reviewers:
          type: array
          items:
            type: string
        share_active:
          type: boolean
        share_expires_at:
          type: string
          format: date-time
        can_edit:
          type: boolean
          description: Whether the caller can change the bundle and its access.

    Invite:
      type: object
      required: [id, role, expires_at, created_by, created_at, status]
      properties:
        id:
          type: string
          format: uuid
        role:
          type: string
          enum: [admin, member]
        expires_at:
          type: string
          format: date-time
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
        used_by:
          type: string
        status:
          type: string
          enum: [pending, used, revoked, expired]

    Settings:
      type: object
      required: [max_file_mb, max_bundle_mb, invite_ttl_days, parallel_calls]
      properties:
        max_file_mb:
          type: integer
          minimum: 1
          maximum: 50
          description: REQ-009. Default 10.
        max_bundle_mb:
          type: integer
          minimum: 1
          maximum: 500
          description: REQ-009. Default 50.
        invite_ttl_days:
          type: integer
          minimum: 1
          maximum: 90
          description: REQ-081. Default 7.
        parallel_calls:
          type: integer
          minimum: 1
          maximum: 16
          description: REQ-105. Model calls at a time per run. Default 4.

    Problem:
      type: object
      description: RFC 9457 problem details with a stable code.
      required: [type, title, status, code]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          description: A stable machine-readable error code.

    Bundle:
      type: object
      required: [id, slug, title, profile_key, source_kind, main_doc, current_version, updated_at]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
          description: In local mode, the bundle folder relative to the served folder.
        title:
          type: string
        profile_key:
          type: string
          description: The frontmatter type of the main doc.
        source_kind:
          type: string
          enum: [local, db, github]
        github:
          $ref: "#/components/schemas/BundleGithub"
        main_doc:
          type: string
          description: The path of the main doc in the bundle.
        current_version:
          $ref: "#/components/schemas/Version"
        updated_at:
          type: string
          format: date-time
        verdict:
          $ref: "#/components/schemas/BundleVerdict"
        run_error:
          type: string
          description: Why the latest run on the current version failed, when it failed.
        visibility:
          $ref: "#/components/schemas/Visibility"
        status:
          $ref: "#/components/schemas/ReviewStatus"

    BundleVerdict:
      type: object
      description: The verdict of the bundle's latest completed run. It is stale when that run is not on the current version.
      required: [run_id, version_number, result, score, radar, waiver_count, relaxed_count, must, should, info, kind]
      properties:
        run_id:
          type: string
          format: uuid
        version_number:
          type: integer
          format: int64
        kind:
          type: string
          enum: [lint, full]
          description: lint means only the lint stage ran.
        result:
          $ref: "#/components/schemas/VerdictResult"
        score:
          type: integer
        radar:
          type: object
          additionalProperties:
            type: integer
        waiver_count:
          type: integer
        relaxed_count:
          type: integer
          description: Checks in adoption mode (REQ-133).
        must:
          type: integer
          description: Open MUST findings.
        should:
          type: integer
        info:
          type: integer
        blocking_threads:
          type: integer
          description: Open blocking threads. Any makes the verdict Not Build Ready (§8.6 rule 2).
        stale_reason:
          type: string
          enum: [upstream_changed]
          description: Set when the verdict is stale because a linked bundle has a newer version than the run read (REQ-056).

    VerdictResult:
      type: string
      enum: [build_ready, not_build_ready, stale]

    CreateBundleRequest:
      type: object
      required: [profile, name]
      properties:
        profile:
          type: string
          description: The profile key.
        name:
          type: string
          description: The bundle folder name.
        title:
          type: string

    Run:
      type: object
      required: [id, bundle_id, version_id, version_number, profile_key, profile_version, kind, status, stage, error, started_at]
      properties:
        id:
          type: string
          format: uuid
        bundle_id:
          type: string
          format: uuid
        version_id:
          type: string
          format: uuid
        version_number:
          type: integer
          format: int64
        profile_key:
          type: string
        profile_version:
          type: integer
          format: int64
        kind:
          type: string
          enum: [lint, full]
        status:
          type: string
          enum: [queued, running, complete, failed]
        stage:
          type: string
        error:
          type: string
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        tokens_in:
          type: integer
          format: int64
        tokens_out:
          type: integer
          format: int64
        cost_estimate:
          type: number
          description: USD, from the prices on the role assignments.
        cache_hits:
          type: integer
          format: int64
          description: Steps answered from the cache (REQ-021).
        notes:
          type: array
          description: Notes for the run report, such as "no search source configured" (REQ-034).
          items:
            type: string
        verdict:
          $ref: "#/components/schemas/BundleVerdict"

    RunEstimate:
      type: object
      required: [calls, cached_steps, tokens_in, tokens_out, priced]
      properties:
        calls:
          type: integer
        cached_steps:
          type: integer
        tokens_in:
          type: integer
          format: int64
        tokens_out:
          type: integer
          format: int64
        cost_usd:
          type: number
        priced:
          type: boolean
          description: False when the reviewer role has no prices, so there is no cost.

    RunEvent:
      type: object
      required: [type, stage]
      properties:
        type:
          type: string
          enum: [stage, progress, done, failed]
        stage:
          type: string
        message:
          type: string
        done:
          type: integer
        total:
          type: integer
        cache_hits:
          type: integer

    Claim:
      type: object
      required: [id, text, label, reason, sources, anchor]
      properties:
        id:
          type: string
          format: uuid
        text:
          type: string
        label:
          type: string
          enum: [verified, contradicted, unverified]
        reason:
          type: string
        sources:
          type: array
          items:
            type: string
        anchor:
          $ref: "#/components/schemas/Anchor"

    TraceView:
      type: object
      required: [links, incoming, matrices, suggestions]
      properties:
        links:
          type: array
          description: The links of the current version, from frontmatter and link rules.
          items:
            $ref: "#/components/schemas/BundleLink"
        incoming:
          type: array
          description: Links from other bundles to this one.
          items:
            $ref: "#/components/schemas/BundleLink"
        standalone:
          $ref: "#/components/schemas/Standalone"
        matrices:
          type: array
          description: One matrix for this bundle's own IDs, when other bundles implement it, and one for each bundle it implements.
          items:
            $ref: "#/components/schemas/TraceMatrix"
        suggestions:
          type: array
          items:
            $ref: "#/components/schemas/IdSuggestion"

    BundleRef:
      type: object
      required: [id, slug, title, profile_key]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        title:
          type: string
        profile_key:
          type: string

    BundleLink:
      type: object
      required: [kind, origin, target_kind, target_ref]
      properties:
        kind:
          type: string
          enum: [implements, refines, references, supersedes]
        origin:
          type: string
          enum: [frontmatter, rule]
        target_kind:
          type: string
          enum: [bundle, external]
        target_ref:
          type: string
          description: The target as written. For an incoming link, the source bundle's slug.
        bundle:
          $ref: "#/components/schemas/BundleRef"
          description: The linked bundle. Absent when no bundle matches the target.

    Standalone:
      type: object
      required: [reason, acknowledged_by]
      properties:
        reason:
          type: string
        acknowledged_by:
          type: string

    TraceMatrix:
      type: object
      required: [upstream, rows, columns, cells]
      properties:
        upstream:
          $ref: "#/components/schemas/BundleRef"
        rows:
          type: array
          items:
            $ref: "#/components/schemas/TraceRow"
        columns:
          type: array
          items:
            $ref: "#/components/schemas/BundleRef"
        cells:
          type: array
          description: cells[row][column].
          items:
            type: array
            items:
              $ref: "#/components/schemas/TraceCell"

    TraceRow:
      type: object
      required: [id, text, anchor]
      properties:
        id:
          type: string
        text:
          type: string
        anchor:
          $ref: "#/components/schemas/Anchor"

    TraceCell:
      type: object
      required: [state, refs]
      properties:
        state:
          type: string
          enum: [referenced, covered_by, out_of_scope, gap]
        refs:
          type: array
          items:
            $ref: "#/components/schemas/Anchor"
        reason:
          type: string
        target:
          type: string

    IdSuggestion:
      type: object
      required: [id, text, anchor]
      properties:
        id:
          type: string
        text:
          type: string
        anchor:
          $ref: "#/components/schemas/Anchor"

    BuildQuestion:
      type: object
      required: [id, number, text, level, cites, anchor, result, answers, groups]
      properties:
        id:
          type: string
          format: uuid
        number:
          type: integer
        text:
          type: string
        level:
          type: string
          enum: [MUST, SHOULD]
        cites:
          type: array
          items:
            $ref: "#/components/schemas/Cite"
        anchor:
          $ref: "#/components/schemas/Anchor"
        result:
          type: string
          enum: [agree, diverge, gap]
        answers:
          type: array
          description: One per reader, in reader order. Readers are named by number only (DEC-013).
          items:
            $ref: "#/components/schemas/ReaderAnswer"
        groups:
          type: array
          description: The judge's groups of reader numbers with the same meaning.
          items:
            type: array
            items:
              type: integer

    Cite:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [section, trace]
        path:
          type: array
          items:
            type: string
        id:
          type: string

    ReaderAnswer:
      type: object
      required: [reader, answer, answered, quotes]
      properties:
        reader:
          type: integer
        answer:
          type: string
        answered:
          type: boolean
          description: False for NOT SPECIFIED, and for an answer with no quote found in the bundle (REQ-043).
        quotes:
          type: array
          items:
            $ref: "#/components/schemas/QuoteCheck"

    QuoteCheck:
      type: object
      required: [text, found]
      properties:
        text:
          type: string
        found:
          type: boolean

    MCPConnectionInput:
      type: object
      required: [name, transport, tool_allowlist, is_search]
      properties:
        name:
          type: string
        transport:
          type: string
          enum: [stdio, http]
        command:
          type: array
          items:
            type: string
          description: For stdio, one argument per item.
        url:
          type: string
          description: For http.
        secret:
          type: string
          description: Write-only. An http server gets it as a bearer token; a stdio server as the variable in secret_env.
        secret_env:
          type: string
        tool_allowlist:
          type: array
          items:
            type: string
        is_search:
          type: boolean
        search_tool:
          type: string
          description: The allowlisted tool that searches, when is_search is true.

    MCPConnection:
      type: object
      required: [id, name, transport, has_secret, secret_last4, tool_allowlist, is_search, search_tool]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        transport:
          type: string
        command:
          type: array
          items:
            type: string
        url:
          type: string
        secret_env:
          type: string
        has_secret:
          type: boolean
        secret_last4:
          type: string
        tool_allowlist:
          type: array
          items:
            type: string
        is_search:
          type: boolean
        search_tool:
          type: string

    MCPTool:
      type: object
      required: [name, description, read_only, destructive]
      properties:
        name:
          type: string
        description:
          type: string
        read_only:
          type: boolean
        destructive:
          type: boolean

    RunList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Run"

    Anchor:
      type: object
      description: A range of text with context (SDD §8.8).
      required: [file, heading_path, quote, prefix, suffix, start, end]
      properties:
        file:
          type: string
        heading_path:
          type: array
          items:
            type: string
        quote:
          type: string
        prefix:
          type: string
        suffix:
          type: string
        start:
          type: integer
          description: Byte offset of the quote in the file.
        end:
          type: integer
        detached:
          type: boolean
          description: The text changed, and Speccy cannot find the quote in the current version (SDD §8.8).

    Finding:
      type: object
      required: [id, check_slug, level, stage, relaxed, message, anchor, waived]
      properties:
        waived:
          type: boolean
          description: A valid waiver covers this finding (REQ-074).
        id:
          type: string
          format: uuid
        check_slug:
          type: string
        level:
          type: string
          enum: [MUST, SHOULD, INFO]
        stage:
          type: string
        relaxed:
          type: boolean
          description: The check is in adoption mode, so it reports at INFO (REQ-133).
        message:
          type: string
        fix:
          type: string
        layer:
          type: string
          enum: [ambiguous, unverified, contradicted, risk, slop]
          description: The overlay layer that shows this finding (SDD §13.2). No layer for other findings.
        anchor:
          $ref: "#/components/schemas/Anchor"
          description: The anchor in the bundle's current version, re-anchored when the run read an older version.

    Tour:
      type: object
      required: [points]
      properties:
        run_id:
          type: string
          format: uuid
          description: The run whose findings the tour uses. Absent before the first review.
        points:
          type: array
          items:
            $ref: "#/components/schemas/TourPoint"

    TourPoint:
      type: object
      description: One point that needs a human decision. The ask states one explicit decision.
      required: [key, kind, ask, context]
      properties:
        key:
          type: string
        kind:
          type: string
          enum: [blocking_thread, finding, waiver, open_decision]
        ask:
          type: string
        context:
          type: string
          description: Why the point needs a decision, in one or two sentences.
        level:
          type: string
          enum: [MUST, SHOULD, INFO]
        check_slug:
          type: string
        anchor:
          $ref: "#/components/schemas/Anchor"
        finding_id:
          type: string
          format: uuid
        thread_id:
          type: string
          format: uuid
        waiver_id:
          type: string
          format: uuid
        can_approve:
          type: boolean
          description: For a waiver, the caller can approve or reject it now.

    RunReport:
      type: object
      required: [stages, categories]
      properties:
        stages:
          type: array
          items:
            $ref: "#/components/schemas/StageTiming"
        readers:
          $ref: "#/components/schemas/ReaderDiversity"
        categories:
          type: array
          description: Open findings by radar category (SDD §8.7), in radar order.
          items:
            $ref: "#/components/schemas/CategoryCount"

    StageTiming:
      type: object
      required: [stage, started_at]
      properties:
        stage:
          type: string
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time

    ReaderDiversity:
      type: object
      description: How many readers answered, and how many distinct models served them (REQ-046). Models are not named (DEC-013).
      required: [readers, distinct_models, low]
      properties:
        readers:
          type: integer
        distinct_models:
          type: integer
        low:
          type: boolean

    CategoryCount:
      type: object
      required: [category, must, should, info]
      properties:
        category:
          type: string
        score:
          type: integer
        must:
          type: integer
        should:
          type: integer
        info:
          type: integer

    FixSuggestion:
      type: object
      description: A patch that replaces one exact text in one file (REQ-025).
      required: [finding_id, file, old, new, explanation, version_id]
      properties:
        finding_id:
          type: string
          format: uuid
        file:
          type: string
        old:
          type: string
        new:
          type: string
        explanation:
          type: string
        version_id:
          type: string
          format: uuid
          description: The version the patch was written for.

    DiffSummary:
      type: object
      required: [summary, changes, fixed, added]
      properties:
        summary:
          type: string
          description: What changed in meaning, in one or two sentences.
        changes:
          type: array
          items:
            type: string
        from_verdict:
          $ref: "#/components/schemas/VerdictResult"
        to_verdict:
          $ref: "#/components/schemas/VerdictResult"
        fixed:
          type: array
          description: Findings of the older version that the newer version no longer has.
          items:
            $ref: "#/components/schemas/FindingBrief"
        added:
          type: array
          items:
            $ref: "#/components/schemas/FindingBrief"

    FindingBrief:
      type: object
      required: [check_slug, level, message]
      properties:
        check_slug:
          type: string
        level:
          type: string
          enum: [MUST, SHOULD, INFO]
        message:
          type: string

    StartRunRequest:
      type: object
      properties:
        stages:
          type: array
          description: The model stages to run. Absent means all. Lint and the verdict always run.
          items:
            type: string
            enum: [rubric, grounding, divergence, coherence]

    ContentFile:
      type: object
      required: [path, content]
      properties:
        path:
          type: string
          description: The path in the bundle.
        content:
          type: string
          description: The file text, or base64 when encoding is base64.
        encoding:
          type: string
          enum: [text, base64]

    ContentReviewRequest:
      type: object
      required: [files]
      properties:
        slug:
          type: string
          description: The bundle's slug. Links from other bundles and to this one use it.
        main_doc:
          type: string
          description: The main doc of a single-file bundle (REQ-001 form b). Absent means the one file with a type in its frontmatter.
        profile:
          type: string
          description: The profile for a main doc with no type in its frontmatter (REQ-130).
        stages:
          type: array
          items:
            type: string
            enum: [rubric, grounding, divergence, coherence]
        files:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: "#/components/schemas/ContentFile"

    ContentReview:
      type: object
      required: [id, report_path, profile_key, profile_version, main_doc, verdict, findings, notes]
      properties:
        id:
          type: string
          format: uuid
        report_path:
          type: string
          description: The app page of the report, relative to the server, such as /reviews/{id}.
        profile_key:
          type: string
        profile_version:
          type: integer
          format: int64
        main_doc:
          type: string
        verdict:
          $ref: "#/components/schemas/ContentVerdict"
        findings:
          type: array
          items:
            $ref: "#/components/schemas/Finding"
        notes:
          type: array
          items:
            type: string
        tokens_in:
          type: integer
          format: int64
        tokens_out:
          type: integer
          format: int64
        cost_estimate:
          type: number
        cache_hits:
          type: integer

    ContentVerdict:
      type: object
      required: [result, score, radar, waiver_count, relaxed_count, must, should, info]
      properties:
        result:
          $ref: "#/components/schemas/VerdictResult"
        score:
          type: integer
        radar:
          type: object
          additionalProperties:
            type: integer
        waiver_count:
          type: integer
        relaxed_count:
          type: integer
        must:
          type: integer
        should:
          type: integer
        info:
          type: integer

    BundleGithub:
      type: object
      description: Where a GitHub bundle comes from, and its draft (REQ-123).
      required: [repo, branch, path, draft, ahead]
      properties:
        repo:
          type: string
        branch:
          type: string
        path:
          type: string
        draft:
          type: boolean
          description: The current version has changes that are not on GitHub.
        ahead:
          type: boolean
          description: GitHub changed after the draft started.
        pr_url:
          type: string

    GithubConnection:
      type: object
      required: [configured, api_url]
      properties:
        configured:
          type: boolean
        token_last4:
          type: string
        api_url:
          type: string
        login:
          type: string
          description: The GitHub account of the token, from the last check.

    GithubSource:
      type: object
      required: [id, repo, branch, path, head_commit, error, bundles]
      properties:
        id:
          type: string
          format: uuid
        repo:
          type: string
        branch:
          type: string
        path:
          type: string
        head_commit:
          type: string
        synced_at:
          type: string
          format: date-time
        error:
          type: string
        bundles:
          type: integer

    FindingList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Finding"

    Thread:
      type: object
      required: [id, anchor_kind, anchor, addressed_to, title, blocking, status, created_by, created_at, last_message_at, message_count]
      properties:
        id:
          type: string
          format: uuid
        bundle_id:
          type: string
          format: uuid
        profile_key:
          type: string
        anchor_kind:
          type: string
          enum: [text, section, finding, check]
        anchor:
          type: object
          additionalProperties: true
          description: For text, an Anchor. For a section, {heading_path}. For a finding, {finding_id, check_slug}. For a check, {check_slug}.
        addressed_to:
          type: string
          enum: [humans, ai]
        title:
          type: string
        blocking:
          type: boolean
        status:
          type: string
          enum: [open, resolved]
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
        last_message_at:
          type: string
          format: date-time
        message_count:
          type: integer

    ThreadDetail:
      allOf:
        - $ref: "#/components/schemas/Thread"
        - type: object
          required: [messages, answering]
          properties:
            messages:
              type: array
              items:
                $ref: "#/components/schemas/ThreadMessage"
            answering:
              type: boolean
              description: The AI is writing an answer.

    ThreadMessage:
      type: object
      required: [id, seq, author_kind, author_name, body, sources, decision, created_at]
      properties:
        id:
          type: string
          format: uuid
        seq:
          type: integer
        author_kind:
          type: string
          enum: [user, guest, ai]
        author_id:
          type: string
        author_name:
          type: string
        body:
          type: string
        sources:
          type: array
          items:
            type: string
        decision:
          type: string
          enum: ["", decision, reversal]
        created_at:
          type: string
          format: date-time

    OpenThread:
      type: object
      required: [anchor_kind, anchor, addressed_to, body]
      properties:
        anchor_kind:
          type: string
          enum: [text, section, finding, check]
        anchor:
          type: object
          additionalProperties: true
        addressed_to:
          type: string
          enum: [humans, ai]
        title:
          type: string
        body:
          type: string
        blocking:
          type: boolean

    PostMessage:
      type: object
      required: [body]
      properties:
        body:
          type: string

    Waiver:
      type: object
      required: [id, bundle_id, check_slug, level, section, reason, status, requested_by, approvals, policy, needed, can_approve, created_at]
      properties:
        id:
          type: string
          format: uuid
        bundle_id:
          type: string
          format: uuid
        check_slug:
          type: string
        level:
          type: string
        section:
          type: array
          items:
            type: string
        reason:
          type: string
        status:
          type: string
          enum: [requested, approved, rejected, invalidated]
        requested_by:
          type: string
        approvals:
          type: array
          items:
            type: string
        policy:
          type: string
          description: The waiver policy (§9.1).
        needed:
          type: integer
          description: The approvals the policy needs.
        can_approve:
          type: boolean
          description: Whether the caller can approve or reject it now.
        created_at:
          type: string
          format: date-time

    ReviewStatus:
      type: string
      enum: [draft, in_review, approved, superseded]

    BundleStatus:
      type: object
      required: [status, reviewers, approvals, required, can_request, can_approve]
      properties:
        status:
          $ref: "#/components/schemas/ReviewStatus"
        reviewers:
          type: array
          items:
            type: string
        approvals:
          type: array
          items:
            type: object
            required: [by, version_id, at]
            properties:
              by:
                type: string
              version_id:
                type: string
                format: uuid
              at:
                type: string
                format: date-time
        required:
          type: integer
        can_request:
          type: boolean
        can_approve:
          type: boolean
        approve_blocked_by:
          type: string
          description: Why the caller cannot approve now, when they cannot.

    Person:
      type: object
      required: [id, name, email, role]
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        role:
          type: string

    Inbox:
      type: object
      required: [items, seen_at]
      properties:
        seen_at:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: "#/components/schemas/InboxItem"

    InboxItem:
      type: object
      required: [kind, bundle_id, bundle_title, text, at, unread]
      properties:
        kind:
          type: string
          enum: [review_request, waiver_request, message, mention, run]
        bundle_id:
          type: string
          format: uuid
        bundle_title:
          type: string
        thread_id:
          type: string
          format: uuid
        text:
          type: string
        at:
          type: string
          format: date-time
        unread:
          type: boolean

    Insights:
      type: object
      required: [profiles]
      properties:
        profiles:
          type: array
          items:
            $ref: "#/components/schemas/ProfileInsights"

    ProfileInsights:
      type: object
      required: [key, name, bundles, standalone, build_ready, runs_to_build_ready, hours_to_build_ready, hours_to_approval, top_failing, waiver_rate]
      properties:
        key:
          type: string
        name:
          type: string
        bundles:
          type: integer
        standalone:
          type: integer
        build_ready:
          type: integer
          description: Bundles whose current verdict is Build Ready.
        runs_to_build_ready:
          type: number
          description: The median number of review runs before the first Build Ready verdict. 0 with no data.
        hours_to_build_ready:
          type: number
          description: The median hours from the first review to the first Build Ready verdict.
        hours_to_approval:
          type: number
          description: The median hours from in review to approved.
        top_failing:
          type: array
          items:
            type: object
            required: [check_slug, count]
            properties:
              check_slug:
                type: string
              count:
                type: integer
        waiver_rate:
          type: array
          items:
            type: object
            required: [check_slug, waived, requested]
            properties:
              check_slug:
                type: string
              waived:
                type: integer
              requested:
                type: integer

    ProfileInput:
      type: object
      required: [yaml, template]
      properties:
        yaml:
          type: string
        template:
          type: string

    ProfileDetail:
      type: object
      required: [key, name, version, origin, yaml, template, versions, maintainers, can_edit, editable]
      properties:
        key:
          type: string
        name:
          type: string
        version:
          type: integer
          format: int64
        origin:
          type: string
        yaml:
          type: string
        template:
          type: string
        versions:
          type: array
          items:
            type: object
            required: [version, created_by, created_at]
            properties:
              version:
                type: integer
                format: int64
              created_by:
                type: string
              created_at:
                type: string
                format: date-time
        maintainers:
          type: array
          items:
            type: string
        can_edit:
          type: boolean
        editable:
          type: boolean
          description: False when the profile cannot be saved here, such as a built-in in local mode with no .speccy/profiles folder rights.

    Profile:
      type: object
      required: [key, name, version, origin]
      properties:
        key:
          type: string
        name:
          type: string
        version:
          type: integer
          format: int64
        origin:
          type: string
          description: built-in, or the path of the profile file.

    ProfileList:
      type: object
      required: [items, problems]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Profile"
        problems:
          type: array
          description: Profile files that did not load, with the reason.
          items:
            type: string

    BackendKind:
      type: string
      enum: [openai, anthropic, openrouter, deepseek, agent_cli]

    BackendInput:
      type: object
      required: [kind, name]
      properties:
        kind:
          $ref: "#/components/schemas/BackendKind"
        name:
          type: string
        secret:
          type: string
          description: The API key. Write-only.
        base_url:
          type: string
          description: Overrides the provider's API address.
        preset:
          type: string
          description: "For agent_cli: claude, cursor-agent, opencode, pi, or custom."
        command:
          type: array
          items:
            type: string
          description: For a custom agent CLI. {model}, {schema}, and {prompt_file} are replaced.
        prompt_via:
          type: string
          enum: [stdin, file]

    Backend:
      type: object
      required: [id, kind, name, has_secret, secret_last4, roles]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/BackendKind"
        name:
          type: string
        has_secret:
          type: boolean
        secret_last4:
          type: string
        base_url:
          type: string
        preset:
          type: string
        command:
          type: array
          items:
            type: string
        prompt_via:
          type: string
        roles:
          type: array
          description: The roles that use this backend.
          items:
            type: string

    BackendList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Backend"

    BackendTest:
      type: object
      required: [ok, duration_ms]
      properties:
        ok:
          type: boolean
        answer:
          type: string
        error:
          type: string
        tokens_in:
          type: integer
          format: int64
        tokens_out:
          type: integer
          format: int64
        estimated:
          type: boolean
        duration_ms:
          type: integer
          format: int64

    Preset:
      type: object
      required: [name, installed, command, verified]
      properties:
        name:
          type: string
        installed:
          type: boolean
        command:
          type: array
          items:
            type: string
        verified:
          type: string

    PresetList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Preset"

    RoleName:
      type: string
      enum: [reviewer, reader_1, reader_2, reader_3, judge, writer]

    RoleInput:
      type: object
      required: [backend_id, model]
      properties:
        backend_id:
          type: string
          format: uuid
        model:
          type: string
        price_in_per_mtok:
          type: number
          description: Price per million input tokens, for cost estimates.
        price_out_per_mtok:
          type: number

    Role:
      type: object
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/RoleName"
        backend_id:
          type: string
          format: uuid
        model:
          type: string
        price_in_per_mtok:
          type: number
        price_out_per_mtok:
          type: number

    RoleList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Role"

    Budget:
      type: object
      required: [month, tokens_used]
      properties:
        month:
          type: string
          description: YYYY-MM, in UTC.
        token_limit:
          type: integer
          format: int64
        tokens_used:
          type: integer
          format: int64

    BundleList:
      type: object
      required: [items, problems]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Bundle"
        next_cursor:
          type: string
        problems:
          type: array
          description: Folders that are not valid bundles, for example with two main docs (REQ-001).
          items:
            $ref: "#/components/schemas/BundleProblem"

    BundleProblem:
      type: object
      required: [path, message]
      properties:
        path:
          type: string
        message:
          type: string

    BundleFile:
      type: object
      required: [path, size, sha256, is_main_doc]
      properties:
        path:
          type: string
        size:
          type: integer
          format: int64
        sha256:
          type: string
        is_main_doc:
          type: boolean

    FileList:
      type: object
      required: [version, items]
      properties:
        version:
          $ref: "#/components/schemas/Version"
        items:
          type: array
          items:
            $ref: "#/components/schemas/BundleFile"

    Version:
      type: object
      required: [id, number, created_by, message, created_at]
      properties:
        id:
          type: string
          format: uuid
        number:
          type: integer
          format: int64
        created_by:
          type: string
        message:
          type: string
        created_at:
          type: string
          format: date-time

    VersionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Version"
        next_cursor:
          type: string

    WriteResult:
      type: object
      required: [version, changed]
      properties:
        version:
          $ref: "#/components/schemas/Version"
        changed:
          type: boolean
          description: False when the write left the bundle unchanged, so no version was created.

    RenameRequest:
      type: object
      required: [from, to, base_version]
      properties:
        from:
          type: string
        to:
          type: string
        base_version:
          type: string
          format: uuid

    ImportRequest:
      type: object
      properties:
        name:
          type: string
          description: The bundle folder name. The default comes from the file name or the doc title.
        file:
          type: string
          contentMediaType: application/octet-stream
          description: A .md file or a .zip file.
        text:
          type: string
          description: Pasted markdown.

    Diff:
      type: object
      required: [from, to, files, sections]
      properties:
        from:
          $ref: "#/components/schemas/Version"
        to:
          $ref: "#/components/schemas/Version"
        files:
          type: array
          items:
            $ref: "#/components/schemas/FileDiff"
        sections:
          type: array
          description: The sections of the main doc, matched by heading path.
          items:
            $ref: "#/components/schemas/SectionDiff"

    ChangeStatus:
      type: string
      enum: [added, removed, modified, unchanged]

    FileDiff:
      type: object
      required: [path, status, binary, lines]
      properties:
        path:
          type: string
        status:
          $ref: "#/components/schemas/ChangeStatus"
        binary:
          type: boolean
        lines:
          type: array
          description: Line operations for a modified text file. Empty otherwise.
          items:
            $ref: "#/components/schemas/LineOp"

    SectionDiff:
      type: object
      required: [heading_path, status, lines]
      properties:
        heading_path:
          type: array
          items:
            type: string
        status:
          $ref: "#/components/schemas/ChangeStatus"
        lines:
          type: array
          items:
            $ref: "#/components/schemas/LineOp"

    LineOp:
      type: object
      required: [op, text]
      properties:
        op:
          type: string
          enum: [equal, insert, delete]
        text:
          type: string
          description: One or more whole lines, each ending with a newline except possibly the last line of the file.

    RenderRequest:
      type: object
      required: [markdown]
      properties:
        markdown:
          type: string
        bundle_id:
          type: string
          format: uuid
          description: When set, relative image links resolve to files in this bundle.
        path:
          type: string
          description: The path of the file in the bundle, so relative links resolve from its folder.

    RenderResult:
      type: object
      required: [html]
      properties:
        html:
          type: string
          description: >
            HTML. Each block element has data-src-start and data-src-end (byte offsets into the
            markdown) and data-line (the 1-based first line). Mermaid blocks are
            <pre class="mermaid">.

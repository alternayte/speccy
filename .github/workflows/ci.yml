name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  JUST_VERSION: "1.58.0"
  GOLANGCI_LINT_VERSION: "v2.12.2"

jobs:
  # The gate of just verify, split into two jobs that run at the same time. go-tests runs the
  # Go tests once with the postgres tag, which covers SQLite and Postgres.
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository.
        uses: actions/checkout@v5

      - name: Set up Go.
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install just.
        uses: extractions/setup-just@v3
        with:
          just-version: ${{ env.JUST_VERSION }}

      - name: Install golangci-lint.
        uses: golangci/golangci-lint-action@v8
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          install-only: true

      - name: Run gen-check, lint, the web tests, the budget and the docs check.
        run: just ci-checks

  go-tests:
    name: go-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository.
        uses: actions/checkout@v5

      - name: Set up Go.
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install just.
        uses: extractions/setup-just@v3
        with:
          just-version: ${{ env.JUST_VERSION }}

      - name: Run the Go tests on SQLite and Postgres.
        run: just test-pg

  verify:
    name: verify
    runs-on: ubuntu-latest
    needs: [checks, go-tests]
    if: always()
    steps:
      - name: Pass when both jobs passed.
        run: test "${{ needs.checks.result }}" = success && test "${{ needs.go-tests.result }}" = success

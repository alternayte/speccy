openapi: 3.1.0
info:
  title: Payments
  version: 1.0.0
paths:
  /orders/{orderId}/pay:
    post:
      operationId: payOrder
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The order is paid.
        "502":
          description: The provider failed after every retry.
